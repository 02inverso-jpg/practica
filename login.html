<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · PULSO</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">PULSO<span>.</span></a>
    <nav class="site-nav">
      <a href="directorio.html">Directorio</a>
    </nav>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Iniciar sesión</h1>

    <div id="login-mensaje" class="form-message hidden"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="login-boton" class="btn btn-primary btn-block">Iniciar sesión</button>
    </form>

    <p class="auth-footnote">¿Eres un asociado nuevo? Escríbenos para darte de alta.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
