<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Asociado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container my-5">
    <div class="row">
      <!-- Datos del Asociado -->
      <div class="col-md-4 text-center">
        <img id="asociadoFoto" src="https://via.placeholder.com/180" class="rounded-circle img-fluid mb-3 shadow" style="width: 180px; height: 180px; object-fit: cover;">
        <h2 id="asociadoNombre" class="fw-bold">Cargando...</h2>
        <p id="asociadoCategoria" class="badge bg-primary fs-6"></p>
        
        <div class="card mt-4 text-start">
          <div class="card-header bg-light fw-bold">Horarios de Atención</div>
          <div class="card-body" id="asociadoHorarios">
            <p class="mb-1"><strong>Lunes a Viernes:</strong> <span id="horarioLV">09:00 - 18:00</span></p>
            <p class="mb-1"><strong>Sábados:</strong> <span id="horarioSab">09:00 - 14:00</span></p>
            <p class="mb-0"><strong>Domingos:</strong> <span id="horarioDom">Cerrado</span></p>
          </div>
        </div>
      </div>

      <!-- Contenido Principal -->
      <div class="col-md-8">
        <!-- Carrusel de Galería -->
        <h4 class="fw-bold mb-3">Galería de Trabajos</h4>
        <div id="galeriaCarrusel" class="carousel slide mb-5 shadow rounded overflow-hidden" data-bs-ride="carousel">
          <div class="carousel-inner" id="carrouselItems">
            <div class="carousel-item active">
              <img src="https://images.unsplash.com/photo-1581858726788-75bc0f6a952d?auto=format&fit=crop&w=800&q=80" class="d-block w-100" style="height: 380px; object-fit: cover;">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#galeriaCarrusel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#galeriaCarrusel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>

        <!-- Servicios -->
        <h4 class="fw-bold mb-3">Servicios Ofrecidos</h4>
        <div id="listaServicios" class="mb-5">
          <span class="badge bg-secondary me-2 fs-6">Servicio General</span>
        </div>

        <!-- Foro de Opiniones / Reseñas -->
        <h4 class="fw-bold mb-3">Foro de Opiniones de Clientes</h4>
        <div class="card mb-4 shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Dejar una Opinión</h5>
            <form id="formResena">
              <div class="mb-3">
                <label class="form-label">Tu Nombre</label>
                <input type="text" id="clienteNombre" class="form-control" required placeholder="Ej. Carlos Pérez">
              </div>
              <div class="mb-3">
                <label class="form-label">Calificación</label>
                <select id="clienteCalificacion" class="form-select">
                  <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                  <option value="4">⭐⭐⭐⭐ (4/5)</option>
                  <option value="3">⭐⭐⭐ (3/5)</option>
                  <option value="2">⭐⭐ (2/5)</option>
                  <option value="1">⭐ (1/5)</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Tu Opinión</label>
                <textarea id="clienteComentario" class="form-control" rows="3" required placeholder="Escribe tu experiencia con este profesional..."></textarea>
              </div>
              <button type="submit" class="btn btn-success">Publicar Opinión</button>
            </form>
          </div>
        </div>

        <!-- Listado de Reseñas -->
        <div id="listaResenas"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/perfil.js"></script>
</body>
</html>
