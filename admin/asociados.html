<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asociados · Admin PULSO</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="dashboard.html" class="logo">PULSO<span>.</span></a>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="asociados.html" class="active">Asociados</a>
      <span class="disabled">Solicitudes</span>
      <span class="disabled">Categorías</span>
      <span class="disabled">Servicios</span>
      <span class="disabled">Usuarios</span>
      <span class="disabled">Configuración</span>
    </nav>
    <button id="admin-signout" class="signout">Cerrar sesión</button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Asociados</h1>
      <a href="asociado-form.html" class="btn btn-primary">+ Nuevo asociado</a>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input type="text" id="buscar-input" placeholder="Buscar por nombre…">
      </div>

      <table class="data-table">
        <thead>
          <tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Ciudad</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody id="asociados-body">
          <tr><td colspan="6">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="js/admin-guard.js"></script>
<script src="js/asociados.js"></script>
</body>
</html>
